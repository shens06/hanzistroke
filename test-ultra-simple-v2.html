<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Button Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 50px;
      text-align: center;
    }
    button {
      padding: 30px 60px;
      font-size: 24px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    button:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body>
  <h1>Click the Button Below</h1>
  <p>This is a super simple test</p>

  <button onclick="alert('✅ BUTTON WORKS!')">CLICK ME</button>

  <script>
    // This alert runs when page loads
    alert('✅ Page loaded! JavaScript is working!');
  </script>
</body>
</html>
