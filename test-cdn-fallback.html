<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDN Fallback Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }
    button {
      padding: 20px 40px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 12px;
      background: #6366f1;
      color: white;
      font-weight: bold;
      border: none;
    }
    #target {
      width: 400px;
      height: 400px;
      margin: 20px auto;
      border: 3px solid #6366f1;
      border-radius: 20px;
    }
    .msg {
      padding: 15px;
      margin: 10px;
      background: #d1fae5;
      border-radius: 8px;
      font-weight: bold;
    }
    .error {
      background: #fee;
      color: #dc2626;
    }
  </style>
</head>
<body>
  <h1>🧪 Testing Multiple CDN Sources</h1>
  <div class="msg" id="status">Trying to load HanziWriter...</div>

  <div id="target">
    <div id="hw"></div>
  </div>

  <button onclick="testAnimation()" id="testBtn" style="display:none;">▶️ Test Animation</button>

  <script>
    let writer = null;
    let cdnAttempts = 0;

    function updateStatus(msg, isError) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = msg;
      if (isError) {
        statusEl.className = 'msg error';
      } else {
        statusEl.className = 'msg';
      }
      console.log(msg);
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = () => resolve(src);
        script.onerror = () => reject(src);
        document.head.appendChild(script);
      });
    }

    async function tryLoadHanziWriter() {
      const cdnSources = [
        'https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js',
        'https://unpkg.com/hanzi-writer@3.7.3/dist/hanzi-writer.min.js',
        'https://cdn.skypack.dev/hanzi-writer@3.7.3'
      ];

      for (let i = 0; i < cdnSources.length; i++) {
        try {
          updateStatus(`Attempt ${i + 1}/${cdnSources.length}: Trying ${cdnSources[i].split('/')[2]}...`);
          await loadScript(cdnSources[i]);

          if (typeof HanziWriter !== 'undefined') {
            updateStatus(`✅ SUCCESS! Loaded from ${cdnSources[i].split('/')[2]}`);
            alert(`✅ HanziWriter loaded successfully from CDN #${i + 1}!`);
            initializeWriter();
            return;
          }
        } catch (e) {
          updateStatus(`❌ Failed from ${cdnSources[i].split('/')[2]}. Trying next...`, true);
          console.error('Failed:', cdnSources[i], e);
        }
      }

      // All CDNs failed
      updateStatus('❌ ALL CDN sources failed! Cannot load HanziWriter library.', true);
      alert('❌ All CDN sources failed to load. Your network might be blocking external scripts.');
    }

    function initializeWriter() {
      try {
        writer = HanziWriter.create('hw', '你', {
          width: 360,
          height: 360,
          padding: 10,
          showOutline: true,
          showCharacter: true
        });
        document.getElementById('testBtn').style.display = 'inline-block';
      } catch (e) {
        updateStatus('❌ Error creating writer: ' + e.message, true);
      }
    }

    function testAnimation() {
      if (!writer) {
        alert('❌ Writer not initialized!');
        return;
      }

      updateStatus('🎬 Starting animation...');

      try {
        writer.animateCharacter({
          onComplete: function() {
            updateStatus('✅ Animation completed!');
            alert('✅ Animation worked!');
          }
        });
      } catch (e) {
        updateStatus('❌ Animation error: ' + e.message, true);
        alert('❌ Animation failed: ' + e.message);
      }
    }

    // Start loading on page load
    window.addEventListener('load', tryLoadHanziWriter);
  </script>
</body>
</html>
